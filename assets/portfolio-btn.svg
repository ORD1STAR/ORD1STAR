<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 84" width="420" height="84" role="img" aria-label="Open my portfolio at ord1star.github.io">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffc46e"/><stop offset="1" stop-color="#ff9b3d"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="6" y="6" width="408" height="60" rx="30"/></clipPath>
<filter id="s" x="-10%" y="-30%" width="120%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#ff9b3d" flood-opacity=".38"/></filter>
</defs>
<style>
.t{font:800 21px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2.2px;fill:#1a0f00}
.u{font:600 11.5px 'Consolas','Courier New',monospace;letter-spacing:1.3px;fill:#1a0f00;opacity:.72}
.arr{animation:nudge 1.5s ease-in-out infinite}
.sw{animation:sweep 3.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes sweep{0%{transform:translateX(-140px) skewX(-20deg)}55%,100%{transform:translateX(560px) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="6" y="6" width="408" height="60" rx="30" fill="url(#g)" filter="url(#s)"/>
<g clip-path="url(#c)"><rect class="sw" x="0" y="0" width="90" height="72" fill="url(#sh)"/></g>
<text class="t" x="34" y="36">OPEN MY PORTFOLIO</text>
<text class="u" x="35" y="54">ord1star.github.io</text>
<g class="arr"><path d="M350 30 H378 M368 21 L378 30 L368 39" fill="none" stroke="#1a0f00" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
