<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;12 .5 .5;0 .5 .5" dur="14s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#7ef0d8"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#5aa9ff"/></linearGradient>
