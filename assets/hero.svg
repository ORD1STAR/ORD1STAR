<style>
.name{font:800 52px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:5px}
.sub{font:600 19px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:7px;fill:#9fe8d9}
.tag{font:500 14px 'Consolas','Courier New',monospace;fill:#7aa7b5;letter-spacing:1px}
.edge{stroke:#2dd4bf;stroke-width:1;opacity:.12;stroke-dasharray:6 8;animation:flow 2.4s linear infinite}
.node{fill:#5eead4;filter:url(#glow);animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.p{fill:#7dd3fc;opacity:0;animation:twinkle 6s ease-in-out infinite}
.wave{fill:none;stroke:url(#wave);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 5s ease-in-out infinite;filter:url(#glow)}
.wave2{fill:none;stroke:#60a5fa;stroke-width:1;opacity:.25;transform:translateY(14px)}
.rise{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.scan{animation:scan 4.5s ease-in-out 1.4s infinite}
.cursor{animation:blink 1.05s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{transform:scale(.75);opacity:.55}50%{transform:scale(1.5);opacity:1}}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.85}}
@keyframes draw{0%{stroke-dashoffset:1100}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-1100}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes scan{0%{transform:translateX(-340px)}60%,100%{transform:translateX(1000px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cursor{opacity:1}.rise{opacity:1;transform:none}.wave{stroke-dashoffset:0}}
</style>
